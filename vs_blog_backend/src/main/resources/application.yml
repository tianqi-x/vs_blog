server:
  port: ${SERVER_PORT:8080}

app:
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
  media:
    storage-dir: ${MEDIA_STORAGE_DIR:./var/media}

spring:
  application:
    name: vs-blog-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vs_blog}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    schemas: public
    baseline-on-migrate: true
    baseline-version: 1